services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airline_b2b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airline_b2b_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-airline_b2b}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  server:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://airline_b2b:airline_b2b_local_password@db:5432/airline_b2b?schema=public}
      JWT_SECRET: ${JWT_SECRET:-docker-local-change-me}
      CHAT_ENCRYPTION_KEY: ${CHAT_ENCRYPTION_KEY:-}
      NODE_ENV: production
      PORT: 5000
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DOCKER_APPLY_SCHEMA: ${DOCKER_APPLY_SCHEMA:-true}
    depends_on:
      - db
    ports:
      - "${SERVER_HOST_PORT:-5000}:5000"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_HOST_PORT:-3000}:80"

volumes:
  db-data:
