name: Deploy Airline B2B

on:
  push:
    branches:
      - product/airline-b2b
      - main

concurrency:
  group: airline-b2b-deploy
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ secrets.SERVER_IP || '206.189.130.168' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSHPASS: ${{ secrets.SSHPASS || secrets.SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            echo "SSH_AUTH_MODE=key" >> "$GITHUB_ENV"
          elif [ -n "$SSHPASS" ]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
            echo "SSH_AUTH_MODE=password" >> "$GITHUB_ENV"
          else
            echo "Missing SSH_PRIVATE_KEY or SSHPASS/SERVER_PASSWORD secret" >&2
            exit 1
          fi

      - name: Sync backend and shared to server
        run: |
          if [ "$SSH_AUTH_MODE" = "password" ]; then
            RSYNC=(sshpass -e rsync -e "ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -o PreferredAuthentications=password")
          else
            RSYNC=(rsync)
          fi
          "${RSYNC[@]}" -avz --delete \
            --exclude="node_modules" --exclude="dist" --exclude=".env" --exclude="error-registry*.json" \
            ./airline-b2b/server/ root@"$SERVER_IP":/root/apps/ado-b2b/airline-b2b/server/
          "${RSYNC[@]}" -avz --delete \
            ./airline-b2b/shared/ root@"$SERVER_IP":/root/apps/ado-b2b/airline-b2b/shared/

      - name: Rebuild and restart backend
        run: |
          if [ "$SSH_AUTH_MODE" = "password" ]; then
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -o PreferredAuthentications=password)
          else
            SSH=(ssh)
          fi
          "${SSH[@]}" root@"$SERVER_IP" "cd /root/apps/ado-b2b/airline-b2b/server && pm2 stop airline-b2b-server || true && rm -rf node_modules dist && npm ci && npx prisma generate && npx prisma db push && npm run build && pm2 restart airline-b2b-server --update-env"

  deploy-frontend:
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ secrets.SERVER_IP || '206.189.130.168' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSHPASS: ${{ secrets.SSHPASS || secrets.SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: airline-b2b/client/package-lock.json

      - name: Build frontend
        run: |
          cd airline-b2b/client
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            echo "SSH_AUTH_MODE=key" >> "$GITHUB_ENV"
          elif [ -n "$SSHPASS" ]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
            echo "SSH_AUTH_MODE=password" >> "$GITHUB_ENV"
          else
            echo "Missing SSH_PRIVATE_KEY or SSHPASS/SERVER_PASSWORD secret" >&2
            exit 1
          fi

      - name: Deploy static export
        run: |
          if [ "$SSH_AUTH_MODE" = "password" ]; then
            sshpass -e rsync -e "ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -o PreferredAuthentications=password" -avz --delete ./airline-b2b/client/out/ root@"$SERVER_IP":/var/www/b2b.booking.ado-finance.com/html/
          else
            rsync -avz --delete ./airline-b2b/client/out/ root@"$SERVER_IP":/var/www/b2b.booking.ado-finance.com/html/
          fi
